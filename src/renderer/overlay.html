<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Interviewer Max</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="overlay">
  <div id="card">
    <div id="bar">
      <span id="dot"></span>
      <span id="title">Interviewer Max</span>
      <span class="spacer"></span>
      <button id="listen" title="Empezar/parar a escuchar">▶ Escuchar</button>
      <button id="gear" title="Ajustes (Ctrl+Shift+S)">⚙</button>
      <button id="quit" title="Salir">✕</button>
    </div>
    <div id="heard" title="Lo que oigo"></div>
    <div id="answer"><span class="muted">Pulsa «Escuchar». Ctrl+Shift+H oculta · Ctrl+Shift+C modo click-through · Ctrl+Shift+Espacio responde ya.</span></div>
    <input id="manual" placeholder="O escribe la pregunta y pulsa Enter…" />
  </div>
  <script src="overlay.js"></script>
</body>
</html>
